<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🎓 Student Management System</h1>
        <p class="subtitle">Spring Boot + Plain HTML/CSS/JS</p>
    </header>

    <!-- Add / Edit Form -->
    <section class="form-card">
        <h2 id="formTitle">Add New Student</h2>
        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="form-row">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required placeholder="e.g. Rajesh Kumar">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="e.g. rajesh@example.com">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" required placeholder="e.g. CSE">
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="e.g. 20">
                </div>
                <div class="form-group">
                    <label for="marks">Marks</label>
                    <input type="number" step="0.01" id="marks" placeholder="e.g. 85.5">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn btn-primary">Add Student</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary" style="display:none;">Cancel</button>
            </div>
        </form>
    </section>

    <!-- Search bar -->
    <section class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Search by name...">
        <button id="searchBtn" class="btn btn-outline">Search</button>
        <button id="clearBtn" class="btn btn-outline">Clear</button>
    </section>

    <!-- Student Table -->
    <section class="table-card">
        <table id="studentTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Age</th>
                    <th>Marks</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Rows are filled in by JavaScript -->
            </tbody>
        </table>
        <p id="emptyMsg" class="empty-msg" style="display:none;">No students found. Add one above 👆</p>
    </section>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
